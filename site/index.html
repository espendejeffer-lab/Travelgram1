<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.TG_API = "/api";</script>
</head>
<body>
<title>TravelGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@500&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky ticket header, Instagram-style grid of boarding-pass cards, phone tab bar fixed to the bottom */
:root{
  --bg:#E6F4F8; --surface:#FFFFFF; --surface-2:#F2F9FB; --ink:#0B3954; --muted:#4A6A7C; --line:#C6DFE7;
  --accent:#087E8B; --accent-ink:#FFFFFF; --hot:#F26B38; --hot-ink:#FFFFFF; --sun:#FFC857; --sun-ink:#0B3954;
  --btn:#0B3954; --btn-ink:#FFFFFF; --chip:#D3EAF1; --ok:#1C7F52; --warn:#A85A0C; --bad:#B93A27;
  --overlay:rgba(6,32,47,.62); --shadow:0 1px 2px rgba(11,57,84,.08),0 10px 28px rgba(11,57,84,.10);
  --show-bg:#0B3954; --show-ink:#E6F4F8;
  --f-head:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px; --pop:#0B3954;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06202F; --surface:#0C2D42; --surface-2:#103751; --ink:#E6F4F8; --muted:#95B7C7; --line:#1E4A64;
  --accent:#3DB6C2; --accent-ink:#06202F; --hot:#F47A4C; --hot-ink:#1A0B04; --sun:#FFC857; --sun-ink:#06202F;
  --btn:#FFC857; --btn-ink:#06202F; --chip:#14415C; --ok:#55C994; --warn:#F2A650; --bad:#FF8670;
  --overlay:rgba(0,0,0,.7); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --show-bg:#041722; --show-ink:#E6F4F8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06202F; --surface:#0C2D42; --surface-2:#103751; --ink:#E6F4F8; --muted:#95B7C7; --line:#1E4A64;
  --accent:#3DB6C2; --accent-ink:#06202F; --hot:#F47A4C; --hot-ink:#1A0B04; --sun:#FFC857; --sun-ink:#06202F;
  --btn:#FFC857; --btn-ink:#06202F; --chip:#14415C; --ok:#55C994; --warn:#F2A650; --bad:#FF8670;
  --overlay:rgba(0,0,0,.7); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --show-bg:#041722; --show-ink:#E6F4F8; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.lbl{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ico{width:1.1em;height:1.1em;fill:currentColor;flex:none;vertical-align:-.15em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px dashed var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-head);font-weight:700;font-size:1.25rem}
.brand .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--hot);color:var(--hot-ink)}
.brand .mark .ico{transform:rotate(45deg)}
.brand small{display:block;font-family:var(--f-mono);font-weight:500;font-size:.62rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem;position:relative}
.nav a[aria-current="page"]{background:var(--chip)}
.badge-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hot);color:var(--hot-ink);font-size:.72rem;font-weight:700;margin-left:4px}
.rolebtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.demo{background:var(--sun);color:var(--sun-ink);font-size:.85rem;text-align:center;padding:6px 16px}

/* bottom tab bar */
.tabs{display:none}
@media (max-width:760px){
  .nav{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:500;padding:4px 0;position:relative}
  .tabs a .ico{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--accent)}
  .tabs a.post .ico{width:44px;height:44px;padding:10px;margin-top:-18px;border-radius:50%;background:var(--hot);color:var(--hot-ink);box-shadow:var(--shadow)}
  .tabs .badge-n{position:absolute;top:0;right:22%;margin:0}
  main{padding-bottom:96px}
}
main{padding-block:20px 48px}

/* buttons, chips, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;background:var(--btn);color:var(--btn-ink);min-height:44px}
.btn.hot{background:var(--hot);color:var(--hot-ink)}
.btn.teal{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;background:var(--chip);color:var(--ink)}
.pick{background:var(--sun);color:var(--sun-ink)}
.st-pending{background:var(--sun);color:var(--sun-ink)}
.st-ok{background:var(--ok);color:var(--surface)}
.st-back{background:var(--hot);color:var(--hot-ink)}
.st-bad{background:var(--bad);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 14px;font-size:16px}
textarea.input{resize:vertical;min-height:90px}
.input:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.err{color:var(--bad);font-size:.88rem;font-weight:500}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:14px 16px}

/* boarding pass card */
.feed-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.pass{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .18s ease}
.pass:hover{transform:translateY(-3px)}
.pass .ph{padding:10px 10px 0;position:relative}
.frame{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--chip)}
.frame.empty{display:grid;place-items:center;color:var(--muted)}
.pass .badges{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.stub{position:relative;margin-top:12px;padding:14px 14px 14px;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.stub::before,.stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.stub::before{left:-10px}.stub::after{right:-10px}
.stub h3{font-size:1rem;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.kv div{min-width:0}
.kv b{display:block;font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flight{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.rx-mini{display:flex;gap:10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .pass .ph{padding:6px 6px 0}.stub{padding:12px 10px}.stub::before,.stub::after{width:16px;height:16px;top:-9px}
  .stub::before{left:-8px}.stub::after{right:-8px}.pass .kv{grid-template-columns:1fr}.pass .kv div:nth-child(n+3){display:none}
  .pass .badges{top:12px;left:12px;right:12px}.stub h3{font-size:.92rem}
}
.model{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:var(--ink);margin-bottom:22px}
.model .ph{padding:12px}
.model .frame{aspect-ratio:4/3}
.model .body{padding:22px 22px 22px 26px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:12px;justify-content:center;position:relative}
@media (max-width:640px){.model{grid-template-columns:1fr}.model .body{border-left:0;border-top:2px dashed var(--line);padding:18px}}
.empty-state{text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-state .ico{width:48px;height:48px;color:var(--accent);transform:rotate(45deg)}

/* post page */
.post{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.post{grid-template-columns:1fr}}
.post .bigphoto{width:100%;max-height:72vh;object-fit:cover;border-radius:22px;background:var(--chip);display:block}
.ticket{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ticket .tt{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ticket .kv{padding:14px 20px;border-top:2px dashed var(--line);grid-template-columns:repeat(3,1fr)}
@media (max-width:420px){.ticket .kv{grid-template-columns:1fr 1fr}}
.player{padding:16px 20px;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.player video{width:100%;max-height:60vh;border-radius:12px;background:#000;display:block}
.player audio{width:100%}
.audio-card{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:12px;padding:12px}
.audio-card .ico{width:28px;height:28px;color:var(--accent)}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages .tag{background:var(--surface-2);border:1px solid var(--line)}
.stages .tag i{font-style:normal;font-family:var(--f-mono);color:var(--accent)}
.rx{display:flex;gap:8px;flex-wrap:wrap}
.rx button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.9rem;font-variant-numeric:tabular-nums}
.rx button[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.comments{display:flex;flex-direction:column;gap:10px}
.cmt{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.cmt.mine-pending{border-style:dashed}
.cmt .who{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
.cmt p{overflow-wrap:anywhere}

/* create */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center;background:var(--surface-2);min-height:150px}
.drop img{max-height:280px;width:auto;max-width:100%;border-radius:12px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.waiting{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.waiting .plane{width:64px;height:64px;color:var(--hot);animation:fly 3.2s ease-in-out infinite}
@keyframes fly{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(0,-8px)}}
@media (prefers-reduced-motion:reduce){.waiting .plane{animation:none}.pass{transition:none}}
.progress{font-weight:600;color:var(--accent)}

/* guide */
.route{display:grid;gap:0;position:relative}
.stop{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.stop::before{content:"";position:absolute;left:21px;top:44px;bottom:0;border-left:2px dashed var(--line)}
.stop:last-child::before{display:none}
.stop .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-weight:700}
.stop:nth-child(3) .dot{background:var(--hot);color:var(--hot-ink)}
.stop .q{font-size:.95rem;color:var(--muted)}
.guide-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:860px){.guide-grid{grid-template-columns:1fr}}
.seg.gtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;max-width:600px;overflow:visible}
.seg.gtabs button{font-size:1rem;padding:10px 12px;white-space:normal;line-height:1.25}
@media (max-width:480px){.seg.gtabs button{font-size:.9rem;padding:9px 6px}}
.mplayer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mplayer audio{flex:1 1 240px;min-width:0;height:42px}
.mparts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mparts li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:background-color .25s,border-color .25s}
.mparts li.on{background:color-mix(in srgb,var(--sun) 32%,var(--surface));border-color:var(--hot)}
.mparts p{margin-top:6px;line-height:1.65;font-size:1.02rem}
.mplay{width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem;cursor:pointer}
.mparts li.on .mplay{background:var(--hot);color:var(--hot-ink)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checklist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.checklist li::before{content:"✓";width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--surface);font-weight:700;font-size:.8rem}
[data-klass="g7"] .mparts li.on{border:3px solid var(--pop)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.bank .panel{padding:16px;display:flex;flex-direction:column;gap:8px}
.phrase{font-family:var(--f-head);font-weight:500;font-size:.98rem}
.rules{display:grid;gap:12px;counter-reset:r}
.rule{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.rule .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);font-weight:700;font-family:var(--f-head)}

/* teacher */
.ttabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.qitem{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.qitem img{width:140px;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--chip)}
@media (max-width:560px){.qitem{grid-template-columns:1fr}.qitem img{width:100%;aspect-ratio:4/3}}
.qitem video{width:100%;max-height:260px;border-radius:10px;background:#000}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;border:1px solid var(--line);flex-wrap:wrap}
.lrow img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none}
.lrow .grow{flex:1;min-width:140px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums}
.codebox{font-family:var(--f-mono);font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:.08em;color:var(--hot)}

/* sign-in */
.join{max-width:460px;margin:24px auto}
.join .ticket .tt{padding:24px}
.join-head{background:var(--btn);color:var(--btn-ink);padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.join-head .ico{width:32px;height:32px;transform:rotate(45deg)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal .panel{max-width:560px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--btn);color:var(--btn-ink);padding:12px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

/* past travels, reactions, filter */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;align-self:flex-start}
.seg a,.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--ink);white-space:nowrap;cursor:pointer}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.story{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.02rem;line-height:1.7}
.fb{display:flex;gap:8px;flex-wrap:wrap}
.fb button{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;cursor:pointer;min-width:64px;font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.fb button .e{font-size:1.5rem;line-height:1.1;transition:transform .15s ease}
.fb button:hover .e{transform:scale(1.18)}
.fb button[aria-pressed="true"]{border-color:var(--hot);background:var(--chip);font-weight:700}
.tag.solo{background:var(--accent);color:var(--accent-ink)}
.tag.flag{background:var(--hot);color:var(--hot-ink)}

.door.s10 .sub{color:#BFE3EC}

.door.s10 .go{background:#F26B38;color:#FFFFFF}
.door.g7{background:#6C4CF1;color:#FFFFFF;border:3px solid #1E2A4A;box-shadow:6px 6px 0 #1E2A4A;font-family:"Nunito",system-ui,sans-serif}

.door.g7 .sub{color:#EDE8FF;font-weight:600}
.door.g7 .tagx{font-weight:800;font-size:.75rem;letter-spacing:.1em;color:#FFD23F}

.slide .where{font-size:clamp(1rem,1.5vw,1.35rem);color:#BFE3EC}
.slide video{width:100%;max-height:34vh;border-radius:16px;background:#000}
.slide audio{width:100%}
.qslide{text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.qslide h2{font-size:clamp(2.2rem,6vw,5rem);color:#FFFFFF;font-weight:700}
.qslide .starters{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}

.qslide .ico{width:clamp(56px,8vw,96px);height:clamp(56px,8vw,96px);color:#F26B38;transform:rotate(45deg)}

  }
  if (p.cat === "adventure" && has(x.activity)) {
    const df = DIFF.find(z => z[0] === x.difficulty), ag = AGAIN.find(z => z[0] === x.again);

  }

}

ure words",["crunchy","soft","juicy","chewy"]],["Opinions",["My favourite part was…","I didn't like… because…","It was better than I expected."]],["Price",["It was cheap.","It was a bit expensive, but…"]],["Recommending",["You should try it!","It's great for families and friends.","I give it … stars."]]],"check":["Describe the look, smell and taste.","Give a reason for your opinion (because…).","Talk about the price.","Finish with your star rating."],"model":{"title":"The best bánh mì in Hội An","parts":["Hello, food lovers! Today I'm reviewing a bánh mì. If you don't know it, it's a Vietnamese sandwich, and it's one of my favourite foods!","I ate it at a small shop in the old town of Hội An. It was very busy, and there was a long line outside, but the line moved quickly.","My bánh mì looked amazing. The bread was warm and crunchy on the outside, but soft inside. It had grilled pork, fresh vegetables and a little chilli. It smelled so good! The best part was the sauce. It was sweet and a little bit spicy.","It was cheap, only thirty-five thousand đồng. The staff were busy, but they were friendly and fast.","Would I eat there again? Yes, definitely! I give it four and a half stars. You should try it if you visit Hội An!"],"audio":"audio/g7-food.mp3","t":[0.25,8.78,16.88,31.65,37.69],"dur":45.3}},"adventure":{"title":"Tell an adventure story ⛰️","intro":"Tell your class about an exciting, scary or surprising day. Use the 5 parts in order. Speak for about 1 to 1½ minutes.","stops":[["Beginning","Where did you go? When? Who did you go with?"],["What happened","What did you do first? What happened next?"],["Best moment","What was the most exciting, scary or surprising part?"],["Ending","How did the adventure end?"],["My feelings","How did you feel? Would you do it again? Why?"]],"bank":[["Starting",["Last summer, I went to…","I went there with my…"]],["Putting things in order",["First,…","Then,…","After that,…","Finally,…"]],["Exciting moments",["Suddenly,…","I couldn't believe it!","My heart was beating fast."]],["Feelings",["I felt so excited / nervous / proud.","I was surprised because…"]],["Ending",["I learned that…","I want to do it again because…"]]],"check":["Tell all 5 parts in order.","Use “Suddenly,…” to make it exciting.","Say how you felt, and why.","Speak slowly and clearly so everyone can follow."],"model":{"title":"Flying over the river in Phong Nha","parts":["Last summer, I went to Phong Nha with my family. It's famous for its huge caves and green jungle.","First, we put on helmets and harnesses. Then, we climbed up a tall wooden tower. I was really nervous because it was very high! After that, the guide clipped me onto the zip line.","The best moment was when I jumped. Suddenly, I was flying over the river! The wind was in my face, and I could see the jungle everywhere. I screamed, but then I started to laugh.","At the end, I landed in the water and swam to a cave. My little brother was waiting for me there, and we couldn't stop laughing.","I felt so proud of myself, because I was scared, but I did it. I learned that trying new things is fun. I really want to do it again!"],"audio":"audio/g7-adventure.mp3","t":[0.25,7.25,19.76,32.28,40.92],"dur":50.7}}},"b2":{"L":{"steps":"Structure","model":"Model answer","listen":"Listen and follow the script. Select a section to replay it.","bank":"Language bank","check":"Success criteria","team":"Start my team story","diary":"Add a trip diary"},"blog":{"title":"Create a travel vlog","intro":"A travel vlog guides viewers through a destination on camera. Aim for a natural, engaging delivery with a clear structure: hook your audience, take them through the highlights and finish with practical advice. Speak for 1.5 to 2 minutes.","stops":[["Hook","Open with a question, a surprising fact or a striking view to grab viewers' attention."],["Context","Where are you, when did you go and why did you choose this destination?"],["Highlights","Take viewers through two or three highlights in detail. What did you see, hear and taste?"],["Practical tips","Give useful advice: the best time to go, how to get around, what to bring."],["Wrap-up","Give your overall opinion and invite viewers to respond."]],"bank":[["Hooking viewers",["Have you ever wondered what it's like to…?","If you're looking for…, this is the place.","Today I'm taking you to…"]],["Guiding viewers",["Let me show you…","What really stood out for me was…","Take a look at this."]],["Describing places",["stunning views","a hidden gem","packed with tourists","peaceful and relaxing","well worth a visit"]],["Giving advice",["My top tip is to…","Make sure you…","It's worth getting up early to…","If I were you, I'd…"]],["Wrapping up",["All in all,…","Would you visit…? Let me know in the comments.","I can't wait to go back."]]],"check":["A clear hook in the first ten seconds","Highlights described with precise, vivid vocabulary","Linking phrases that guide viewers from one section to the next","Practical tips and a clear overall opinion at the end"],"model":{"title":"A weekend in Đà Lạt: is it worth it?","parts":["Have you ever wondered what it's like to wake up above the clouds? Hi everyone, and welcome back. Today I'm taking you to Đà Lạt, the city of eternal spring.","I spent a long weekend here in December with my family. We flew from Hà Nội, and the moment we stepped off the plane, the cool, fresh air was such a relief after the busy city.","Let me show you my three highlights. First, Tuyền Lâm Lake at sunrise. Mist was floating over the water, and it was so peaceful that nobody wanted to speak. Next, the flower gardens, which were packed with tourists, but the colours were absolutely stunning. And finally, the night market. What really stood out for me was a warm cup of soy milk and a grilled rice paper snack, which locals call Vietnamese pizza.","Now for some practical tips. Make sure you bring a warm jacket, because it gets surprisingly cold at night. It's also worth getting up early to see the lake before the crowds arrive. And if I were you, I'd book a small tour, because the city is very hilly and the sights are quite spread out.","All in all, Đà Lạt is well worth a visit, especially if you need a break from the heat. Would you go there? Let me know in the comments, and I'll see you in the next vlog."],"audio":"audio/b2-blog.mp3","t":[0.25,10.77,22.36,49.07,67.52],"dur":78.5}},"food":{"title":"Create a food review","intro":"A food review helps viewers decide whether a place is worth visiting. Give a balanced opinion supported by clear details, and keep your viewers engaged from start to finish. Speak for 1.5 to 2 minutes.","stops":[["Hook","Start with something that grabs attention: what made this meal special?"],["The place","Where is it? What's the atmosphere like, and who is it for?"],["The food","What did you order? Describe how it looked, smelled, tasted and felt."],["Price and service","Was it good value? How were the staff?"],["Your verdict","Would you recommend it, and to whom? Give your rating."]],"bank":[["Describing taste",["rich and savoury","fragrant","spicy, salty, sweet, sour","a bit bland"]],["Describing texture",["crispy","tender","crunchy","juicy"]],["Giving opinions",["The best thing about it was…","I was slightly disappointed by…","It was definitely worth the wait."]],["Price and service",["It's reasonably priced.","It's a little expensive, but…","The staff were really welcoming."]],["Recommending",["I'd definitely recommend it to…","If you like…, you'll love this place.","I'd give it … out of 5."]]],"check":["The five senses used to describe the food","A balanced opinion: positives and at least one negative","Opinions supported with reasons and examples","A clear rating and recommendation at the end"],"model":{"title":"Bánh xèo in Saigon: crispy, crunchy and worth the wait","parts":["Imagine a pancake so big that it hangs off the edge of the plate. That's what I ordered last weekend, and I'm still thinking about it.","The restaurant is a busy, open-air place in Hồ Chí Minh City, with small plastic stools, fans spinning overhead and a cook frying pancakes right by the entrance. It's casual and noisy, so it's perfect for families and groups of friends, but maybe not for a quiet dinner.","I ordered the bánh xèo, a crispy rice pancake filled with shrimp, pork and bean sprouts. As soon as it arrived, I could smell the coconut and turmeric. The edges were incredibly crispy, while the filling was soft and juicy. You wrap each piece in lettuce and fresh herbs, then dip it in sweet and sour fish sauce. The only thing I was slightly disappointed by was that it was a little oily.","It's reasonably priced, at about eighty thousand đồng for a large pancake. The staff were really welcoming, although we had to wait twenty minutes for a table.","Overall, I'd definitely recommend it to anyone who enjoys street food. If you like crunchy textures and fresh flavours, you'll love this place. I'd give it four out of five."],"audio":"audio/b2-food.mp3","t":[0.25,8.46,26.49,50.79,60.44],"dur":71.7}},"adventure":{"title":"Tell an adventure story","intro":"An adventure story takes listeners through a challenge from beginning to end. Build suspense towards the turning point, use a range of past tenses and finish with a thoughtful reflection. Speak for 1.5 to 2 minutes.","stops":[["Setting the scene","Where and when were you? Who were you with, and what was the challenge?"],["What happened","How did the adventure begin? How did things develop?"],["The turning point","What was the most exciting, surprising or difficult moment?"],["How it ended","How did you deal with the problem, and how did the day end?"],["Looking back","How do you feel about it now? What did you learn?"]],"bank":[["Starting your story",["I'll never forget the time…","It all started when…"]],["Setting the scene",["It was a hot / rainy / freezing day in…","We had just arrived in…"]],["Building suspense",["Suddenly,…","All of a sudden,…","To our surprise,…"]],["Describing feelings",["I was absolutely exhausted / thrilled / terrified.","I couldn't believe my eyes."]],["Reflecting",["Looking back, I think…","The experience taught me that…"]]],"check":["All five stages, in a logical order","A mix of past simple, past continuous and past perfect","Suspense language before the turning point","A reflection that explains what you learned"],"model":{"title":"Paddling into the storm in Lan Hạ Bay","parts":["I'll never forget the time my cousin and I went kayaking in Lan Hạ Bay, near Cát Bà Island. It was a hot, sticky morning in June, and we had just finished our exams, so we were ready for a challenge.","It all started smoothly. Our guide showed us how to paddle, and we set off between the huge limestone islands. While we were paddling, we spotted monkeys climbing the cliffs and tiny fishing boats in the distance. After about an hour, we reached a narrow cave that led into a hidden lagoon.","Then, all of a sudden, the sky turned dark grey. A strong wind picked up, and heavy rain began to hit the water. To our surprise, the waves were getting bigger, and our kayak kept turning in circles. I was absolutely terrified, because I couldn't see the guide anymore.","Fortunately, we remembered what he had told us: stay calm and paddle towards the nearest rock. We waited under a cliff until the storm passed, and twenty minutes later, our guide found us. By the time we got back to the boat, we were soaked, but we were laughing.","Looking back, I think it was the most exciting day of the whole summer. The experience taught me that staying calm is the best way to solve a problem, even when you're scared."],"audio":"audio/b2-adventure.mp3","t":[0.25,14.34,33.57,52.1,69.5],"dur":81.1}}},"s10":{"L":{"steps":"Structure","model":"Model answer","listen":"Listen and follow the script. Select a section to replay it.","bank":"Language bank","check":"Success criteria","team":"Start my team story","diary":"Add a trip diary"},"blog":{"title":"Create a travel vlog","intro":"A travel vlog is an on-camera commentary that brings a destination to life. The best vlogs sound natural but are carefully structured: a compelling hook, vividly described highlights, genuinely useful advice and a confident sign-off. Speak for 1.5 to 2 minutes.","stops":[["Hook","Open with a vivid moment, a rhetorical question or a bold claim. Avoid starting with a summary."],["Context","Establish where you are, when you went and what drew you to the destination."],["Highlights","Develop two or three highlights in depth. Appeal to the senses and explain why they matter."],["Insider advice","Offer practical tips on timing, budget and getting around."],["Sign-off","Round off with a reflection and invite viewers to respond."]],"bank":[["Hooking viewers",["Picture this:…","Is … really worth the hype? Let's find out.","Forty-eight hours in…"]],["Guiding the camera",["Let me take you through…","What struck me most was…","Stay with me, because this is worth it."]],["Describing places",["breathtaking views","off the beaten track","a hidden gem","steeped in history","teeming with tourists"]],["Insider tips",["Top tip:…","Whatever you do, don't miss…","It's well worth getting up early to…","Save yourself the trouble and…"]],["Signing off",["Have you been to…? Tell me in the comments.","Until next time…","I can't wait to go back."]]],"check":["A compelling hook rather than a flat summary","Precise, sophisticated vocabulary and varied sentence structures","Smooth transitions that guide viewers between sections","Practical advice delivered in a natural, confident tone"],"model":{"title":"48 hours in Hội An: is it really worth the hype?","parts":["Picture this: it's six in the morning, the streets are completely silent, and the only light comes from hundreds of silk lanterns reflected in the river. Is Hội An really worth the hype? Stay with me, and let's find out.","I spent two days here last April with my family. We'd heard so much about this old trading port that, honestly, I was worried it would be overrated. Within an hour of arriving, though, I'd completely changed my mind.","Let me take you through my highlights. First, the Ancient Town at dawn, before the crowds arrive. Wandering past the mustard-yellow merchant houses, I felt as if I'd stepped back two hundred years. Next, the Japanese Covered Bridge: small, but steeped in history. And finally, the night market. What struck me most was the atmosphere: the scent of grilled pork drifting through the air, boats gliding along the river, and lanterns glowing in every colour imaginable.","Now for some insider tips. Whatever you do, don't miss the town at sunrise, because by ten o'clock it's teeming with tourists. Save yourself the trouble of finding a taxi and rent a bicycle instead, since the town is flat and compact. And if you're on a budget, the street food is outstanding value.","So, is Hội An worth the hype? Absolutely, as long as you plan your days wisely. Have you been, or is it on your list? Tell me in the comments. Until next time!"],"audio":"audio/s10-blog.mp3","t":[0.25,14.49,28.76,59.65,79.27],"dur":90.8}},"food":{"title":"Create a food review","intro":"A persuasive food review combines precise sensory description with a balanced, well-justified verdict. Speak with the authority of a critic, but keep it lively enough to hold your viewers' attention. Speak for 1.5 to 2 minutes.","stops":[["Hook","Grab attention: what made this meal memorable?"],["The place","Where is it, what is the atmosphere like, and who is it for?"],["The food","What did you order? Describe the taste, texture, aroma and presentation."],["Value and service","Was it worth the price? How attentive were the staff?"],["The verdict","Would you recommend it, and to whom? Justify your rating."]],"bank":[["Describing taste",["mouth-watering","tangy, savoury, rich","a little bland","bursting with flavour"]],["Describing texture",["crispy on the outside","melt-in-your-mouth","tender","chewy"]],["Giving opinions",["The highlight of the meal was…","…was slightly disappointing.","It was well worth the wait."]],["Value and service",["Remarkably good value for…","A little overpriced, but…","Service was brisk rather than friendly."]],["Recommending",["I'd highly recommend it to anyone who…","If you're on a budget, …","Give it a miss if…"]]],"check":["Rich sensory language: taste, texture, aroma, presentation","A balanced evaluation with at least one criticism","Opinions justified with specific evidence","A confident final verdict and rating"],"model":{"title":"Bún chả in the Old Quarter: smoky, sticky and worth every đồng","parts":["There's one smell that tells you it's lunchtime in Hà Nội: pork sizzling over charcoal. Follow that smell down a narrow alley in the Old Quarter, and you'll find what might be the best bún chả I've ever eaten.","The restaurant is tiny and unpretentious: a few low tables, a wall covered in faded photos, and a cook fanning the grill on the pavement. It's loud, crowded and slightly chaotic, which, for me, is all part of the charm. It's ideal if you want an authentic local experience, though perhaps not for a quiet conversation.","I ordered the classic set. The grilled pork arrived in a bowl of warm, tangy dipping sauce, with a mountain of fresh herbs and soft rice noodles on the side. The pork was beautifully caramelised: smoky and slightly crispy on the outside, yet tender and juicy inside. The sauce, with its balance of sweet, sour and salty, was bursting with flavour. My only criticism is that the spring rolls were a little greasy and lacked crunch.","At around sixty thousand đồng per person, it's remarkably good value. Service was brisk rather than friendly, but our food arrived within five minutes.","Overall, I'd highly recommend it to anyone who wants to taste Hà Nội at its most authentic. Give it a miss if you prefer air-conditioning and calm. I'm giving it four and a half stars out of five."],"audio":"audio/s10-food.mp3","t":[0.25,13.52,34.19,61.23,71.33],"dur":83.8}},"adventure":{"title":"Tell an adventure story","intro":"A gripping adventure narrative builds tension towards a turning point and ends with genuine reflection. Use narrative tenses, vivid imagery and deliberate pacing to keep your audience hooked. Speak for 1.5 to 2 minutes.","stops":[["Orientation","Set the scene: where, when, who, and what challenge lay ahead?"],["Rising action","How did the adventure unfold? Build tension step by step."],["Turning point","What was the decisive, unforgettable moment?"],["Resolution","How was the problem resolved, and what happened afterwards?"],["Reflection","What did the experience teach you, and how has it changed you?"]],"bank":[["Opening a memory",["I still vividly remember…","Little did I know…"]],["Building tension",["Without warning,…","To my astonishment,…","For a moment, I seriously considered…"]],["Expressing emotions",["I was overwhelmed by…","My heart was pounding."]],["Sequencing",["Shortly afterwards,…","Meanwhile,…","Eventually,…"]],["Reflecting",["Looking back, I realise…","That experience taught me…"]]],"check":["Five clearly developed stages with deliberate pacing","Narrative tenses: past simple, past continuous and past perfect","Vivid imagery and suspense devices such as “Little did I know…”","A reflection that goes beyond “it was fun”"],"model":{"title":"Above the clouds on Fansipan","parts":["I still vividly remember the moment our guide pointed at a tiny peak on the horizon and said, “That's where we're going.” It was a freezing morning in January, and my father and I were about to attempt the two-day trek up Fansipan, the highest mountain in Indochina.","The first day went better than expected. We climbed steadily through bamboo forests and past waterfalls, stopping every hour to catch our breath. By the time we reached the camp, my legs were aching, but I felt unstoppable. Little did I know that the hardest part was still to come.","The next morning, we set off in the dark. Without warning, a thick fog rolled in, and within minutes I could barely see my own hands. The path became steep and slippery, and at one point I lost my footing and slid down a muddy slope. My heart was pounding. For a moment, I seriously considered giving up.","Then my father reached down, pulled me up, and simply said, “One step at a time.” So that's what we did. Eventually, as we climbed the final steps, the fog broke apart, and we found ourselves standing above a sea of clouds, glowing gold in the sunrise.","Looking back, I realise that the summit wasn't the real achievement. That experience taught me that most limits exist only in our heads, and that sometimes the bravest thing you can do is simply keep going."],"audio":"audio/s10-adventure.mp3","t":[0.25,18.53,37.19,58.05,75.87],"dur":90.1}}}};

let lastKey = "", cache = {}, raf = 0, deferT = 0;
function paint(force) {
  if (force) { lastKey = ""; }
  cancelAnimationFrame(raf); raf = requestAnimationFrame(doPaint);
}
const R = (key, html, cls = "") => `<section data-region="${key}"${cls ? ` class="${cls}"` : ""}>${html}</section>`;
function busy(el) {
  const a = document.activeElement;
  if (a && el.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !["file", "checkbox"].includes(a.type)) return true;
  return [...el.querySelectorAll("video,audio")].some(m => !m.paused && !m.ended);
}
function doPaint() {
  if (!S.ready) return;
  axApplyRub();
  chrome();
  const view = $("#view");
  const { key, html } = viewHtml();
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  const fresh = [...tmp.children];
  const keys = fresh.map(n => n.dataset.region).join("|");
  if (key + keys !== lastKey) {
    view.replaceChildren(...fresh); cache = {}; fresh.forEach(n => cache[n.dataset.region] = n.outerHTML); lastKey = key + keys;
  } else {
    let deferred = false;
    fresh.forEach(n => {
      const k = n.dataset.region, s = n.outerHTML;
      if (cache[k] === s) return;
      const old = view.querySelector(`[data-region="${k}"]`);
      if (!old) return;
      if (busy(old)) { deferred = true; return; }
      old.replaceWith(n); cache[k] = s;
    });
    if (deferred) { clearTimeout(deferT); deferT = setTimeout(() => paint(), 2000); }
  }
  modal(); settleSky();
}

async function addFiles(files) {
  const d = curDraft(); if (!d) return;
  const travel = route() === "travel", max = travel ? 10 : 5, msgs = [];
  d.err = ""; d.status = "Preparing your files…"; paint();
  for (const file of files) {
    if (d.items.length >= max) { msgs.push(`You can add up to ${max} ${travel ? "photos and videos" : "photos"}.`); break; }
    const isImg = (file.type || "").startsWith("image/") || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name || "");
    if (isImg) {
      try { const blob = await compressPhoto(file); d.items.push({ blob, url: URL.createObjectURL(blob), kind: "image", type: "image/jpeg" }); }
      catch (e) { msgs.push(`“${file.name}” couldn't be opened. Try a JPG or PNG.`); }
      continue;
    }
    if (!travel) { msgs.push("This section is for photos. Add your spoken story in step 3."); continue; }
    const info = mediaInfo(file);
    if (!info || info.kind !== "video") { msgs.push(`“${file.name}” isn't a photo or video that can be used.`); continue; }
    if (file.size > MAX_BYTES) { msgs.push(`“${file.name}” is ${(file.size / 1048576).toFixed(0)} MB. Each video must be under 20 MB.`); continue; }

    d.items.push({ blob: file, url, kind: "video", type: info.type, duration: isFinite(dur) ? Math.round(dur) : 0 });
  }
  d.status = ""; d.err = msgs.join(" "); paint();
}

function missing(d) {
  if (!d) return [];
  const m = [], travel = route() === "travel", len = v => String(v || "").trim().length;
  if (!d.items.some(x => x.kind === "image")) m.push("a photo");
  if (!d.cat) m.push("type of post");
  else if (!detailsOk(d)) m.push(d.cat === "food" ? "place name and taste rating" : d.cat === "blog" ? "at least one highlight" : "the activity");
  if (!len(d.title)) m.push("title");
  if (!len(d.destination)) m.push("destination");
  if (!d.date) m.push("travel date");
  if (!travel && !teacherMode() && !d.team) m.push("group");
  if (travel) { if (len(d.story) < W.storyMin) m.push(`description (${len(d.story)}/${W.storyMin} characters)`); }
  else {
    if (len(d.desc) < W.descMin) m.push(`description (${len(d.desc)}/${W.descMin} characters)`);
    if (!teacherMode() && rubricKey() === "s10" && len(d.script) < 100) m.push(`your script (${len(d.script)}/100 characters)`);
    if (!(d.mediaRef || d.mediaFile)) m.push("your spoken story clip");
  }
  if (!(travel ? CHECKS.slice(0, 3) : CHECKS).every((_, i) => d.checks[i])) m.push("tick every checklist box");
  return m;
}
function canSubmit() { const d = curDraft(); return !!d && missing(d).length === 0; }
function refreshSubmit() { const b = $("#p-submit"); if (b) b.disabled = !canSubmit() || S.sending; const m = $("#p-missing"), list = missing(curDraft()); if (m) { m.hidden = !list.length; m.textContent = "Still needed: " + list.join(", "); } }
function postStatus(msg) { const d = curDraft(); if (d) d.status = msg; setFormMsg("#p-status", msg); }
function setFormMsg(id, msg) { const el = $(id); if (el) { el.textContent = msg; el.hidden = !msg; } }

async function compressPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
function mediaInfo(file) {
  const t = (file.type || "").toLowerCase(), n = (file.name || "").toLowerCase();
  const audio = t.startsWith("audio/") || /\.(m4a|aac|weba)$/.test(n);
  if (/mp4|quicktime|m4a|3gpp/.test(t) || /\.(mp4|mov|m4a|m4v|3gp)$/.test(n)) return { type: "video/mp4", kind: audio ? "audio" : "video" };
  if (/webm/.test(t) || /\.(webm|weba)$/.test(n)) return { type: "video/webm", kind: audio ? "audio" : "video" };
  return null;
}
function probe(url, kind) {
  return new Promise(res => {
    const el = document.createElement(kind === "audio" ? "audio" : "video"); el.preload = "metadata"; el.muted = true;
    const t = setTimeout(() => res(NaN), 8000);
    el.onloadedmetadata = () => { clearTimeout(t); res(el.duration); }; el.onerror = () => { clearTimeout(t); res(NaN); }; el.src = url;
  });
}
async function onMedia(file) {
  const d = curDraft(); if (!d) return; d.err = "";
  const info = mediaInfo(file);
  if (!info) { d.err = "That clip format can't be used. Record a video, or use an M4A voice memo or MP4/MOV/WEBM file."; return paint(); }
  if (file.size > MAX_BYTES) { d.err = `That clip is ${(file.size / 1048576).toFixed(0)} MB. The limit is 20 MB: record at 720p, or record audio only.`; return paint(); }
  const url = URL.createObjectURL(file), dur = await probe(url, info.kind);
  if (isFinite(dur) && dur > MAX_SEC + 1) { URL.revokeObjectURL(url); d.err = `Your clip is ${fmtDur(dur)}. The limit is ${fmtDur(MAX_SEC)}, so trim it or record a shorter take.`; return paint(); }
  if (d.mediaUrl && d.mediaUrl.startsWith("blob:")) URL.revokeObjectURL(d.mediaUrl);
  Object.assign(d, { mediaFile: file, mediaUrl: url, mediaType: info.type, mediaKind: info.kind, duration: isFinite(dur) ? Math.round(dur) : 0 });
  if (isFinite(dur) && dur < W.shortSec) d.err = `Your clip is ${fmtDur(dur)}. That's allowed, but ${W.aimMsg}.`;
  paint();
}
async function submitPost() {

async function axStart(id) {

  if (axRunning(x)) return;
  await upsert("aiassess/" + id, { ...axIds(id), k: S.klass, job: { state: "running", at: Date.now(), error: "" }, ...(x && x.status ? {} : { status: "pending" }) });
  let ok = false;
  try { const r = await fetch("/.netlify/functions/ai-assess-background", { method: "POST", cache: "no-store", headers: Remote.hdrs({ "content-type": "application/json" }), body: JSON.stringify({ id }) }); ok = r.ok; } catch (e) { }
  if (!ok) { await upsert("aiassess/" + id, { job: { state: "error", at: Date.now(), error: "The AI assessment couldn't start. Check your connection and try again." } }); return; }
  delete S.axEdits[id]; S.axOpen = id;
  toast("The AI is assessing. Results appear here as a private draft in about a minute.");
  [15, 30, 45, 60, 90, 120].forEach(s => setTimeout(() => Remote.pull().catch(() => { }), s * 1000));
}

/* ---------- Separate rankings: Team Stories (speaking, out of 4) and Trip Diaries (writing, out of 16) ----------

      ${m ? (p.mediaKind === "audio" ? `<audio id="sc-media" controls src="${esc(m)}"></audio>` : `<video id="sc-media" controls playsinline src="${esc(m)}"></video>`) : `<p class="where">No clip available.</p>`}</div></div>`; }

  el.innerHTML = `<div class="bar"><b style="font-family:var(--f-head)">TravelGram</b><div class="dots">${stories.map((_, i) => `<i class="${i === curStory ? "on" : ""}"></i>`).join("")}</div><span class="grow"></span>

document.addEventListener("keydown", e => {
  if (!SC) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); showStep(1); }

      else await upsert("csubs/" + uid, { k: S.klass, items: { [cid]: { postId: pid, text, name: nm, status: "pending", feedback: "", createdAt: Date.now() } } });
      $("#c-text").value = ""; toast((personal && !pcApprove()) || teacherMode() ? "Comment posted" : "Sent! Waiting for teacher approval ✈");
    }
  } catch (err) { console.warn(err); toast("That didn't save. Check your connection and try again."); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

function mHighlight(a) {
  const box = document.getElementById("mans"); if (!box || !a) return;
  const ts = (box.dataset.t || "").split(",").map(Number); let i = -1;
  if (!a.ended && (a.currentTime > 0 || !a.paused)) ts.forEach((t, j) => { if (a.currentTime >= t) i = j; });
  box.querySelectorAll(".mparts li").forEach(li => li.classList.toggle("on", +li.dataset.i === i));
}
["timeupdate", "seeked", "ended"].forEach(ev => document.addEventListener(ev, e => { if (e.target && e.target.id === "m-audio") mHighlight(e.target); }, true));
document.addEventListener("play", e => { if (e.target && e.target.id === "m-audio") e.target.playbackRate = S.mRate || 1; }, true);
document.addEventListener("toggle", e => { const d = e.target; if (d && d.matches && d.matches("details.axc")) { if (d.open) S.axOpen = d.dataset.id; else if (S.axOpen === d.dataset.id) S.axOpen = null; return; } if (d && d.matches && d.matches("details.assess")) { if (d.open) S.aOpen = d.dataset.uid; else if (S.aOpen === d.dataset.uid) S.aOpen = null; } }, true);

/* ---------- auto-lock ---------- */
["pointerdown", "keydown", "scroll", "input"].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true, capture: true }));
setInterval(() => { if (S.isTeacher && !S.locked && !SC && Date.now() - (S.lastAct || Date.now()) > 30 * 60 * 1000) A.lock(); }, 60000);

/* ---------- boot ---------- */
(async function boot() {
  try { await Store.init(); }
  catch (e) { $("#view").innerHTML = `<section><div class="empty-state panel"><h2>TravelGram can't connect right now</h2><p class="muted">Check your internet connection, then refresh the page.</p></div></section>`; return; }
  if (Store.mode === "net") { S.uid = Remote.uid; S.isTeacher = Remote.isAdmin; }
  else if (Store.mode === "db") {
    try { S.uid = Store.user ? await Store.user.id() : null; S.isTeacher = Store.user ? !!(await Store.user.canEdit()) : false; } catch (e) { }
  } else { S.isTeacher = true; }
  let k = null;
  try { const g = await Store.doc("config/classes").get(); S.classes = g.exists ? (g.data().list || null) : null; } catch (e) { }
  watchClasses();
  if (S.isTeacher) { const saved = lsGet("tg-klass-t"); k = classOf(saved) ? saved : classList()[0].k; }
  else {
    const uid = curUid();
    if (uid) {
      try {
        const g = await Store.doc("people/" + uid).get(), d = g.exists ? g.data() : null;
        if (d && hasVS(d) && !d.signedOut && classOf(kOf(d))) {
          const lr = await rosterLookup(d.sid);
          if (lr && (lr.data.test || TEST_RE.test(d.sid) || kOf(lr.data) === kOf(d))) {
            k = kOf(d);
            if (lr.realName && lr.realName !== d.realName) { try { await Store.doc("people/" + uid).update({ realName: lr.realName }); } catch (e4) { } }
          }
        }
      } catch (e) { }
    }
  }
  if (S.isTeacher) { if (Store.mode === "net") { S.locked = false; S.lastAct = Date.now(); } else { S.locked = true; watchTsec(); } }
  setKlass(k);
  S.ready = true;
  if (!location.hash) { try { history.replaceState(null, "", S.isTeacher ? "#teacher" : "#feed"); } catch (e) { } }
  startSubs(); paint(true);
})();
})();
</script>
